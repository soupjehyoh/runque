<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Restaurant Queue & Table PWA</title>
    
    <!-- PWA Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    
    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TableQueue">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3448/3448609.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-6 select-none font-sans">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="mb-6 bg-white p-6 rounded-2xl shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-black text-slate-800 tracking-tight">ระบบจัดการโต๊ะอาหาร</h1>
                <p class="text-slate-500 text-sm">จัดการสถานะโต๊ะ T-01 ถึง T-10 (โซนใน / นอก)</p>
            </div>
            <div class="flex items-center space-x-2 w-full md:w-auto">
                <button onclick="resetAllTables()" class="w-full md:w-auto text-xs bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2.5 rounded-xl transition font-semibold">
                    Reset โต๊ะทั้งหมด
                </button>
            </div>
        </header>

        <!-- Dashboard Summary & Filter Bar -->
        <div class="mb-6 bg-white p-4 rounded-2xl shadow-sm flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4">
            <!-- Filter & Sort Controls -->
            <div class="flex flex-wrap items-center gap-3">
                <!-- Search Input -->
                <input type="text" id="search-input" onkeyup="handleSearch(this.value)" placeholder="🔍 ค้นหาโต๊ะ (เช่น T-01)..." class="bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-xl px-3 py-2 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 w-full sm:w-48">

                <!-- Zone Filter Buttons -->
                <div class="inline-flex rounded-xl bg-slate-100 p-1 text-xs font-semibold">
                    <button onclick="setZoneFilter('ALL')" id="zone-btn-ALL" class="px-3 py-1.5 rounded-lg bg-white text-blue-600 shadow-sm transition">ทั้งหมด</button>
                    <button onclick="setZoneFilter('ใน')" id="zone-btn-ใน" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">โซนใน</button>
                    <button onclick="setZoneFilter('นอก')" id="zone-btn-นอก" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">โซนนอก</button>
                </div>

                <!-- Sorting Select -->
                <select id="sort-select" onchange="handleSortChange(this.value)" class="bg-slate-50 border border-slate-300 text-slate-800 text-xs rounded-xl p-2 font-medium cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="last-updated">⚡ เรียงตามการกดล่าสุด (กดล่าสุดขึ้นก่อน)</option>
                    <option value="number-asc">ลำดับปกติ (T-01 ใน -> T-10 นอก)</option>
                    <option value="number-desc">ลำดับย้อนกลับ (T-10 นอก -> T-01 ใน)</option>
                    <option value="status-occupied">โต๊ะที่มีลูกค้า ขึ้นก่อน</option>
                    <option value="status-available">โต๊ะที่ว่าง ขึ้นก่อน</option>
                </select>
            </div>

            <!-- Table Summary Badges -->
            <div id="table-summary" class="flex items-center space-x-3 text-xs font-bold self-end lg:self-center"></div>
        </div>

        <!-- Table Grid -->
        <div id="table-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </div>

    <script>
        // โครงสร้างข้อมูลตั้งต้น
        const defaultTables = [];
        let idCounter = 1;

        for (let i = 1; i <= 10; i++) {
            const numStr = i.toString().padStart(2, '0');
            defaultTables.push({ id: idCounter++, number: i, zone: "ใน", label: `T-${numStr} ใน`, capacity: 4, status: "AVAILABLE", time: null, lastUpdated: 0 });
            defaultTables.push({ id: idCounter++, number: i, zone: "นอก", label: `T-${numStr} นอก`, capacity: 4, status: "AVAILABLE", time: null, lastUpdated: 0 });
        }

        // ดึงข้อมูลจาก LocalStorage หรือใช้ค่า default
        let tables = JSON.parse(localStorage.getItem('restaurant_tables')) || defaultTables;
        let currentSort = "last-updated"; // ตั้งค่าเริ่มต้นให้เรียงตามการกดล่าสุด
        let currentZone = "ALL";
        let searchQuery = "";

        function saveData() {
            localStorage.setItem('restaurant_tables', JSON.stringify(tables));
        }

        function setZoneFilter(zone) {
            currentZone = zone;
            ['ALL', 'ใน', 'นอก'].forEach(z => {
                const btn = document.getElementById(`zone-btn-${z}`);
                if (z === zone) {
                    btn.className = "px-3 py-1.5 rounded-lg bg-white text-blue-600 shadow-sm transition";
                } else {
                    btn.className = "px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition";
                }
            });
            renderTables();
        }

        function handleSearch(val) {
            searchQuery = val.trim().toLowerCase();
            renderTables();
        }

        function handleSortChange(sortValue) {
            currentSort = sortValue;
            renderTables();
        }

        function getFilteredAndSortedTables() {
            let result = [...tables];

            // Filter Zone
            if (currentZone !== "ALL") {
                result = result.filter(t => t.zone === currentZone);
            }

            // Search Filter
            if (searchQuery !== "") {
                result = result.filter(t => t.label.toLowerCase().includes(searchQuery));
            }

            // Sorting
            switch (currentSort) {
                case "last-updated": return result.sort((a, b) => (b.lastUpdated || 0) - (a.lastUpdated || 0));
                case "number-asc": return result.sort((a, b) => a.id - b.id);
                case "number-desc": return result.sort((a, b) => b.id - a.id);
                case "status-occupied": return result.sort((a, b) => (a.status === "OCCUPIED" ? -1 : 1));
                case "status-available": return result.sort((a, b) => (a.status === "AVAILABLE" ? -1 : 1));
                default: return result;
            }
        }

        function renderTables() {
            const grid = document.getElementById('table-grid');
            const summary = document.getElementById('table-summary');
            grid.innerHTML = '';

            const displayTables = getFilteredAndSortedTables();
            const occupiedCount = tables.filter(t => t.status === "OCCUPIED").length;

            summary.innerHTML = `
                <span class="px-3 py-1.5 rounded-xl bg-red-100 text-red-700">มีลูกค้า: ${occupiedCount}</span>
                <span class="px-3 py-1.5 rounded-xl bg-emerald-100 text-emerald-700">โต๊ะว่าง: ${tables.length - occupiedCount}</span>
                <span class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-600">ทั้งหมด: ${tables.length}</span>
            `;

            if (displayTables.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-medium">ไม่พบข้อมูลโต๊ะที่ค้นหา</div>`;
                return;
            }

            displayTables.forEach(table => {
                const isOccupied = table.status === "OCCUPIED";
                const isInside = table.zone === "ใน";

                const card = document.createElement('div');
                card.className = `p-4 rounded-2xl border-2 transition-all flex flex-col justify-between h-48 ${
                    isOccupied 
                    ? 'bg-red-50/80 border-red-500 text-red-950 shadow-md' 
                    : 'bg-white border-slate-200 hover:border-blue-400'
                }`;

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xl font-black block leading-tight tracking-tight">${table.label}</span>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-md inline-block mt-1 ${
                                isInside ? 'bg-indigo-100 text-indigo-700' : 'bg-amber-100 text-amber-800'
                            }">โซน${table.zone}</span>
                        </div>
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-full ${
                            isOccupied ? 'bg-red-200 text-red-800' : 'bg-slate-100 text-slate-600'
                        }">${table.capacity} ที่</span>
                    </div>

                    <div class="my-auto">
                        ${isOccupied ? `
                            <div class="flex items-center space-x-1.5 text-red-600 font-bold text-xs">
                                <span class="relative flex h-2.5 w-2.5">
                                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span>
                                </span>
                                <span>มีลูกค้านั่งแล้ว</span>
                            </div>
                            <p class="text-[11px] text-red-500 font-medium mt-1">เวลาเข้า: ${table.time}</p>
                        ` : `<p class="text-emerald-600 text-xs font-bold flex items-center space-x-1"><span>🟢</span> <span>โต๊ะว่าง</span></p>`}
                    </div>

                    ${!isOccupied ? `
                        <button onclick="seatCustomer(${table.id})" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold py-2 rounded-xl text-xs transition shadow-sm">
                            พาลูกค้านั่ง
                        </button>
                    ` : `
                        <button onclick="clearTable(${table.id})" class="w-full bg-slate-200 hover:bg-slate-300 active:scale-95 text-slate-800 font-bold py-2 rounded-xl text-xs transition">
                            เคลียร์โต๊ะ
                        </button>
                    `}
                `;
                grid.appendChild(card);
            });
        }

        function seatCustomer(id) {
            const table = tables.find(t => t.id === id);
            if (table) {
                table.status = "OCCUPIED";
                table.time = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
                table.lastUpdated = Date.now(); // บันทึก เวลาล่าสุดที่กดโต๊ะนี้
                saveData();
                renderTables();
            }
        }

        function clearTable(id) {
            const table = tables.find(t => t.id === id);
            if (table) {
                table.status = "AVAILABLE";
                table.time = null;
                table.lastUpdated = Date.now(); // บันทึก เวลาล่าสุดที่กดโต๊ะนี้
                saveData();
                renderTables();
            }
        }

        function resetAllTables() {
            if (confirm("คุณต้องการเคลียร์สถานะโต๊ะทั้งหมดใช่หรือไม่?")) {
                tables.forEach(t => { 
                    t.status = "AVAILABLE"; 
                    t.time = null; 
                    t.lastUpdated = 0;
                });
                saveData();
                renderTables();
            }
        }

        renderTables();

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('PWA Ready'))
                    .catch(err => console.log('PWA Failed:', err));
            });
        }
    </script>
</body>
</html>
