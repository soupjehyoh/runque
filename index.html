<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Restaurant Queue & Table PWA</title>
    
    <!-- PWA Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    
    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TableQueue">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3448/3448609.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-6 select-none">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-6 bg-white p-6 rounded-2xl shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">ระบบจัดการโต๊ะอาหาร (PWA)</h1>
                <p class="text-slate-500 text-sm">โซนในร้าน / นอกร้าน (T-01 ถึง T-10)</p>
            </div>
            <button onclick="resetAllTables()" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-lg transition font-medium">
                Reset โต๊ะทั้งหมด
            </button>
        </header>

        <!-- Control Bar -->
        <div class="mb-6 bg-white p-4 rounded-2xl shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-2">
                <label for="sort-select" class="text-sm font-semibold text-slate-600">เรียงลำดับ:</label>
                <select id="sort-select" onchange="handleSortChange(this.value)" class="bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-xl p-2.5 font-medium cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="number-asc">ลำดับโต๊ะ (T-01 ใน -> T-10 นอก)</option>
                    <option value="number-desc">ลำดับโต๊ะ (T-10 นอก -> T-01 ใน)</option>
                    <option value="zone-inside">โซนในร้าน ขึ้นก่อน</option>
                    <option value="zone-outside">โซนนอกร้าน ขึ้นก่อน</option>
                    <option value="status-occupied">โต๊ะที่มีลูกค้า ขึ้นก่อน</option>
                    <option value="status-available">โต๊ะที่ว่าง ขึ้นก่อน</option>
                </select>
            </div>
            <div id="table-summary" class="text-xs font-semibold text-slate-500"></div>
        </div>

        <!-- Table Grid -->
        <div id="table-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </div>

    <script>
        // สร้างข้อมูลโต๊ะอัตโนมัติ T-01 ถึง T-10 (ใน/นอก) รวม 20 โต๊ะ
        const rawTables = [];
        let idCounter = 1;

        for (let i = 1; i <= 10; i++) {
            const numStr = i.toString().padStart(2, '0');
            
            // โต๊ะใน
            rawTables.push({
                id: idCounter++,
                number: i,
                zone: "ใน",
                label: `T-${numStr} ใน`,
                capacity: 4,
                status: "AVAILABLE",
                time: null
            });

            // โต๊ะนอก
            rawTables.push({
                id: idCounter++,
                number: i,
                zone: "นอก",
                label: `T-${numStr} นอก`,
                capacity: 4,
                status: "AVAILABLE",
                time: null
            });
        }

        let tables = rawTables;
        let currentSort = "number-asc";

        // Logic การเรียงลำดับโต๊ะ
        function getSortedTables() {
            let sorted = [...tables];
            switch (currentSort) {
                case "number-asc":
                    return sorted.sort((a, b) => a.id - b.id);
                case "number-desc":
                    return sorted.sort((a, b) => b.id - a.id);
                case "zone-inside":
                    return sorted.sort((a, b) => (a.zone === "ใน" ? -1 : 1));
                case "zone-outside":
                    return sorted.sort((a, b) => (a.zone === "นอก" ? -1 : 1));
                case "status-occupied":
                    return sorted.sort((a, b) => (a.status === "OCCUPIED" ? -1 : 1));
                case "status-available":
                    return sorted.sort((a, b) => (a.status === "AVAILABLE" ? -1 : 1));
                default:
                    return sorted;
            }
        }

        function handleSortChange(sortValue) {
            currentSort = sortValue;
            renderTables();
        }

        function renderTables() {
            const grid = document.getElementById('table-grid');
            const summary = document.getElementById('table-summary');
            grid.innerHTML = '';

            const sortedTables = getSortedTables();
            const occupiedCount = tables.filter(t => t.status === "OCCUPIED").length;
            summary.innerHTML = `มีลูกค้า: <span class="text-red-600 font-bold">${occupiedCount}</span> / โต๊ะว่าง: <span class="text-green-600 font-bold">${tables.length - occupiedCount}</span> (รวม ${tables.length} โต๊ะ)`;

            sortedTables.forEach(table => {
                const isOccupied = table.status === "OCCUPIED";
                const isInside = table.zone === "ใน";
                
                const card = document.createElement('div');
                card.className = `p-4 rounded-2xl border-2 transition-all flex flex-col justify-between h-44 ${
                    isOccupied 
                    ? 'bg-red-50 border-red-500 text-red-900 shadow-md' 
                    : 'bg-white border-slate-200 hover:border-blue-400'
                }`;

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-lg font-black block leading-tight">${table.label}</span>
                            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full inline-block mt-1 ${
                                isInside ? 'bg-indigo-100 text-indigo-700' : 'bg-amber-100 text-amber-800'
                            }">
                                โซน${table.zone}
                            </span>
                        </div>
                        <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${
                            isOccupied ? 'bg-red-200 text-red-800' : 'bg-slate-100 text-slate-600'
                        }">${table.capacity} ที่</span>
                    </div>

                    <div class="my-auto">
                        ${isOccupied ? `
                            <div class="flex items-center space-x-1.5 text-red-600 font-bold text-xs">
                                <span class="relative flex h-2.5 w-2.5">
                                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span>
                                </span>
                                <span>มีลูกค้า</span>
                            </div>
                            <p class="text-[10px] text-red-400 mt-0.5">นั่งเมื่อ: ${table.time}</p>
                        ` : `<p class="text-slate-400 text-xs font-medium">🟢 โต๊ะว่าง</p>`}
                    </div>

                    ${!isOccupied ? `
                        <button onclick="seatCustomer(${table.id})" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-medium py-1.5 rounded-xl text-xs transition">
                            พาลูกค้านั่ง
                        </button>
                    ` : `
                        <button onclick="clearTable(${table.id})" class="w-full bg-slate-200 hover:bg-slate-300 active:scale-95 text-slate-700 font-medium py-1.5 rounded-xl text-xs transition">
                            เคลียร์โต๊ะ
                        </button>
                    `}
                `;
                grid.appendChild(card);
            });
        }

        function seatCustomer(id) {
            const table = tables.find(t => t.id === id);
            if (table) {
                table.status = "OCCUPIED";
                table.time = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
                renderTables();
            }
        }

        function clearTable(id) {
            const table = tables.find(t => t.id === id);
            if (table) {
                table.status = "AVAILABLE";
                table.time = null;
                renderTables();
            }
        }

        function resetAllTables() {
            tables.forEach(t => { t.status = "AVAILABLE"; t.time = null; });
            renderTables();
        }

        renderTables();

        // Register Service Worker สำหรับ PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('PWA Service Worker Registered!'))
                    .catch(err => console.log('Service Worker Failed:', err));
            });
        }
    </script>
</body>
</html>
